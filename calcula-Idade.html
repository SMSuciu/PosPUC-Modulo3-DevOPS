<title>Calcula Idade</title>

Informe o ano que você nasceu: <input placeholder="Ano de nascimento" id="campoAnoDeNascimento"/>
<br><br>
<button onclick="calculaIdade(campoAnoDeNascimento.value)">Calcula</button>

<script>
    function calculaIdade(anoNascimento) 
    {
        if (anoNascimento == '') 
        {
            alert("campo vazio");
        } else
          {
            idade = new Date().getFullYear() - anoNascimento;
            alert("Sua idade é : "+ idade);        
          }
    }
</script>
